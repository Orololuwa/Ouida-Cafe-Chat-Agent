name: ouida-mcp

services:
  ouida-mcp:
    build: ./mcp
    container_name: ouida-mcp
    restart: unless-stopped
    env_file: ./mcp/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8020
      DB_PATH: /data/ouida.db
    volumes:
      # SQLite catalogue and orders. Must be writable by the container's node user (UID 1000).
      - ./data:/data
    ports:
      - "127.0.0.1:8020:8020"
    networks: [web]

networks:
  web:
    external: true
